# iOS IPA derleme workflow'u (bulut macOS runner)
# Windows'ta IPA derlenemedigi icin GitHub Actions'ta macOS kullanilir.
# Manuel calistirmak: Actions > "iOS IPA Build" > Run workflow
name: iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build_ios_ipa.yml'

jobs:
  build-ipa:
    name: IPA Derle (macOS)
    runs-on: macos-14

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: iOS platformunu etkinlestir
        run: flutter config --enable-ios

      - name: Bagimliliklari indir
        run: flutter pub get

      - name: IPA derle (imzasiz)
        # Imzasiz derlenir -> cihaz testi / daha sonra imzalama.
        # Apple Developer hesabi + imza gizlileri eklendiginde
        # "--no-codesign" kaldirilip imzali derleme yapilir.
        run: flutter build ipa --no-codesign

      - name: IPA dosyasini artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: newgenc-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
