# iOS IPA derleme workflow'u (bulut macOS runner)
# Windows'ta IPA derlenemedigi icin GitHub Actions'ta macOS kullanilir.
# Manuel calistirmak: Actions > "iOS IPA Build" > Run workflow
name: iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build_ios_ipa.yml'

jobs:
  build-ipa:
    name: IPA Derle (macOS)
    runs-on: macos-14

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Swift Package Manager & Enable iOS
        run: |
          flutter config --no-enable-swift-package-manager
          flutter config --enable-ios

      - name: Bagimliliklari ve Pod'lari indir
        run: |
          flutter pub get
          cd ios
          pod install || true
          cd ..

      - name: IPA derle (imzasiz)
        run: flutter build ipa --no-codesign

      - name: IPA dosyasini artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: newgenc-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
