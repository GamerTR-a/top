# iOS IPA derleme workflow'u (bulut macOS runner)
# Windows'ta IPA derlenemedigi icin GitHub Actions'ta macOS kullanilir.
# Manuel calistirmak: Actions > "iOS IPA Build" > Run workflow
name: iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build_ios_ipa.yml'

jobs:
  build-ipa:
    name: IPA Derle (macOS)
    runs-on: macos-15

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Swift Package Manager & Enable iOS
        run: |
          flutter config --no-enable-swift-package-manager
          flutter config --enable-ios

      - name: Bagimliliklari ve Pod'lari indir
        run: |
          flutter pub get
          cd ios
          pod install --repo-update || pod install || true
          cd ..

      - name: IPA ve Archive Derle (imzasiz)
        run: |
          flutter build ios --release --config-only
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath ../build/ios/archive/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" archive
          
          mkdir -p ../build/ios/ipa
          cd ../build/ios/archive/Runner.xcarchive/Products/Applications
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../../../ipa/NevGenc.ipa Payload

      - name: IPA dosyasini artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: newgenc-ipa
          path: build/ios/ipa/NevGenc.ipa
          if-no-files-found: error
