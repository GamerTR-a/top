# iOS IPA derleme workflow'u (bulut macOS runner)
# Windows'ta IPA derlenemedigi icin GitHub Actions'ta macOS kullanilir.
# Manuel calistirmak: Actions > "iOS IPA Build" > Run workflow
name: iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build_ios_ipa.yml'

jobs:
  build-ipa:
    name: IPA Derle (macOS)
    runs-on: macos-15

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Swift Package Manager & Enable iOS
        run: |
          flutter config --no-enable-swift-package-manager
          flutter config --enable-ios

      - name: app_config.dart'i secret'lardan olustur
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bash tool/ci_write_app_config.sh

      - name: Bagimliliklari ve Pod'lari indir
        run: |
          flutter pub get
          cd ios
          pod install --repo-update || pod install || true
          cd ..

      - name: IPA ve Archive Derle (imzasiz)
        run: |
          flutter build ios --release --config-only --obfuscate --split-debug-info=build/debug-info
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath ../build/ios/archive/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" archive
          
          mkdir -p ../build/ios/ipa
          cd ../build/ios/archive/Runner.xcarchive/Products/Applications
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../../../ipa/NevGenc.ipa Payload

      - name: Crashlytics dSYM sembollerini yukle
        run: |
          # bkz. kontrol.md Bolum 17.2 — Xcode'da Crashlytics "Run Script" build
          # phase'i olmadigindan dSYM'leri elle yukluyoruz (codemagic.yaml ile
          # ayni desen). Bu build imzasiz/yayinlanmadigi icin GoogleService-Info.plist
          # secret'i burada tanimli degilse adim guvenle atlanir.
          UPLOAD_SYMBOLS="ios/Pods/FirebaseCrashlytics/upload-symbols"
          GSP="ios/Runner/GoogleService-Info.plist"
          DSYMS_DIR="build/ios/archive/Runner.xcarchive/dSYMs"
          if [ ! -f "$UPLOAD_SYMBOLS" ]; then
            echo "::warning::upload-symbols bulunamadi ($UPLOAD_SYMBOLS) — dSYM yuklemesi atlandi."
          elif [ ! -f "$GSP" ]; then
            echo "::warning::GoogleService-Info.plist bulunamadi — dSYM yuklemesi atlandi."
          elif [ ! -d "$DSYMS_DIR" ]; then
            echo "::warning::dSYM klasoru bulunamadi ($DSYMS_DIR) — dSYM yuklemesi atlandi."
          else
            "$UPLOAD_SYMBOLS" -gsp "$GSP" -p ios "$DSYMS_DIR"
          fi

      - name: IPA dosyasini artifact olarak yukle
        uses: actions/upload-artifact@v7
        with:
          name: newgenc-ipa
          path: build/ios/ipa/NevGenc.ipa
          if-no-files-found: error
