name: iOS App Store Build & Upload

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Upload iOS App
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Generate app_config.dart from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bash tool/ci_write_app_config.sh

      - name: Install Dependencies & Pods
        run: |
          flutter pub get
          cd ios
          pod install --repo-update || pod install || true


      - name: Install App Store Connect API Key
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          # Güvenlik: private key SADECE GitHub Secrets'tan okunur; repo içinden
          # (.p8 dosyası) fallback KALDIRILDI — bu, Apple hesap düzeyinde imzalama
          # anahtarının bir gün yanlışlıkla commit edilmesini teşvik eden bir
          # anti-pattern'di. Secret eksikse build burada net bir hatayla durur.
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY secret'ı tanımlı değil. Repo Settings > Secrets and variables > Actions üzerinden ekleyin."
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID:-8NRWS5B4GM}.p8

      - name: Build iOS App & Archive (No Codesign)
        run: |
          flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/debug-info
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath ../build/ios/archive/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" archive || true

      - name: Upload Crashlytics dSYM symbols
        run: |
          # bkz. kontrol.md Bölüm 17.2 — Xcode'da Crashlytics "Run Script" build
          # phase'i olmadığından dSYM'leri elle yüklüyoruz (codemagic.yaml ile
          # aynı desen). Bu build imzasız/yayınlanmadığı için GoogleService-Info.plist
          # secret'ı burada tanımlı değilse adım güvenle atlanır.
          UPLOAD_SYMBOLS="ios/Pods/FirebaseCrashlytics/upload-symbols"
          GSP="ios/Runner/GoogleService-Info.plist"
          DSYMS_DIR="build/ios/archive/Runner.xcarchive/dSYMs"
          if [ ! -f "$UPLOAD_SYMBOLS" ]; then
            echo "::warning::upload-symbols bulunamadı ($UPLOAD_SYMBOLS) — dSYM yüklemesi atlandı."
          elif [ ! -f "$GSP" ]; then
            echo "::warning::GoogleService-Info.plist bulunamadı — dSYM yüklemesi atlandı."
          elif [ ! -d "$DSYMS_DIR" ]; then
            echo "::warning::dSYM klasörü bulunamadı ($DSYMS_DIR) — dSYM yüklemesi atlandı."
          else
            "$UPLOAD_SYMBOLS" -gsp "$GSP" -p ios "$DSYMS_DIR"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NevGenc-iOS-v1.0.25
          path: |
            build/ios/archive/*.xcarchive
            build/ios/iphoneos/*.app
            build/ios/ipa/*.ipa


